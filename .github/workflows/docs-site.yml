name: Docs site

# Lints the spec on every push and pull request. On main, builds the API reference and the
# Postman collection and publishes them to https://developers.hlthstack.io.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint the spec
        run: npx -y @redocly/cli@1.34.0 lint openapi/openapi.yaml
      # The guides in docs/ become each area's introduction on the site and in Postman.
      - name: Add the guides to the spec
        run: |
          mkdir -p build
          npx -y @redocly/cli@1.34.0 bundle openapi/openapi.yaml --ext json -o build/openapi.json
          python scripts/add_guides.py build/openapi.json build/site-openapi.json
      - name: Build the API reference
        run: npx -y @redocly/cli@1.34.0 build-docs build/site-openapi.json -o site/index.html
      - name: Build the Postman collection
        run: |
          npx -y openapi-to-postmanv2@4.25.0 -s build/site-openapi.json -o build/converted.json -p \
            -O folderStrategy=Tags,requestParametersResolution=Example,exampleParametersResolution=Example
          npx -y @redocly/cli@1.34.0 bundle build/site-openapi.json --dereferenced --ext json -o build/site-deref.json
          python scripts/build_postman.py build/converted.json build/site-deref.json site/postman
          cp openapi/openapi.yaml site/openapi.yaml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
      # Updates the published Postman docs in place (same link). On a push, only when the
      # collection differs from the one on the docs site; a manual run always updates.
      - name: Update the published Postman collection
        if: github.event_name != 'pull_request'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          PREVIOUS: ${{ github.event_name == 'push' && '--previous https://developers.hlthstack.io/postman/hlthstack.postman_collection.json' || '' }}
        run: python scripts/update_postman.py site/postman/hlthstack.postman_collection.json $PREVIOUS

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
