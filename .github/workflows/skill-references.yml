name: Skill references

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The skill folder carries copies of openapi/ and docs/; fail if they drift.
      - run: python scripts/sync_skill_references.py --check
